<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newcastle Automotive Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{color-scheme:light}
  body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
  img{max-width:100%}
  [hidden]{display:none!important}
  :root{
    --ink:#151a22;
    --ink-soft:#525c6b;
    --ink-faint:#8590a0;
    --paper:#f2f4f7;
    --surface:#ffffff;
    --surface-2:#e9edf2;
    --border:#d9dfe6;
    --border-soft:#e6eaef;
    --accent:#ff6a1a;
    --accent-ink:#ffffff;
    --accent-soft:#ffe4d3;
    --steel:#3d4a5c;
    --steel-soft:#eef1f5;
    --st-booked:#2f6fed;
    --st-booked-soft:#e4ecfd;
    --st-progress:#c8790f;
    --st-progress-soft:#fbe9cf;
    --st-completed:#1f8f5a;
    --st-completed-soft:#d9f2e5;
    --st-invoiced:#7c5cff;
    --st-invoiced-soft:#ece6ff;
    --danger:#d43d3d;
    --danger-soft:#fbe1e1;
    --shadow-1:0 1px 2px rgba(20,25,35,.06), 0 1px 1px rgba(20,25,35,.04);
    --shadow-2:0 8px 28px rgba(20,25,35,.14), 0 2px 8px rgba(20,25,35,.08);
    --radius-s:8px;
    --radius-m:12px;
    --radius-l:18px;
    --font-display:'Big Shoulders', 'Arial Narrow', sans-serif;
    --font-body:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f6;
      --ink-soft:#a7b0bd;
      --ink-faint:#77808f;
      --paper:#10141b;
      --surface:#171d27;
      --surface-2:#1e2531;
      --border:#2b3342;
      --border-soft:#232a37;
      --accent:#ff7a33;
      --accent-ink:#161116;
      --accent-soft:#3a2216;
      --steel:#9fb0c6;
      --steel-soft:#1c2431;
      --st-booked:#5b8dfd;
      --st-booked-soft:#182642;
      --st-progress:#e5a13c;
      --st-progress-soft:#332510;
      --st-completed:#3fbb84;
      --st-completed-soft:#123425;
      --st-invoiced:#a389ff;
      --st-invoiced-soft:#26203f;
      --danger:#f16464;
      --danger-soft:#3a1a1a;
      --shadow-1:0 1px 2px rgba(0,0,0,.35);
      --shadow-2:0 12px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef1f6;
    --ink-soft:#a7b0bd;
    --ink-faint:#77808f;
    --paper:#10141b;
    --surface:#171d27;
    --surface-2:#1e2531;
    --border:#2b3342;
    --border-soft:#232a37;
    --accent:#ff7a33;
    --accent-ink:#161116;
    --accent-soft:#3a2216;
    --steel:#9fb0c6;
    --steel-soft:#1c2431;
    --st-booked:#5b8dfd;
    --st-booked-soft:#182642;
    --st-progress:#e5a13c;
    --st-progress-soft:#332510;
    --st-completed:#3fbb84;
    --st-completed-soft:#123425;
    --st-invoiced:#a389ff;
    --st-invoiced-soft:#26203f;
    --danger:#f16464;
    --danger-soft:#3a1a1a;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 12px 32px rgba(0,0,0,.5);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:var(--font-display);
    font-weight:700;
    letter-spacing:.01em;
    margin:0;
    text-wrap:balance;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
  a{color:inherit;}
  ::selection{background:var(--accent-soft);}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ---------- App shell ---------- */
  #app{min-height:100%;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:14px;
    padding:12px 18px;
    background:#000;
    border-bottom:1px solid #000;
  }
  .brand{display:flex;align-items:center;margin-right:4px;}
  .brand-logo{height:48px;width:auto;display:block;flex:none;}
  @media (min-width:640px){ .brand-logo{height:54px;} }
  .topbar-title{
    display:none;
    font-family:var(--font-display);font-size:19px;font-weight:700;
    color:#fff;
  }
  .topbar-spacer{flex:1;}
  .me-select-wrap{display:flex;align-items:center;gap:7px;}
  .me-label{font-size:11px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;display:none;}
  .me-select{
    appearance:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:6px 30px 6px 12px;font-size:13px;font-weight:600;color:#fff;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path d='M5 8l5 5 5-5' fill='none' stroke='%23ffffff' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 9px center;background-size:13px;
    max-width:150px;
  }
  .top-action{
    position:fixed;top:86px;right:18px;z-index:16;
    height:42px;border-radius:999px;border:none;
    padding:0 18px 0 14px;
    background:var(--accent);color:var(--accent-ink);
    box-shadow:var(--shadow-2);display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
    font-family:var(--font-body);font-size:13.5px;font-weight:700;white-space:nowrap;
  }
  .top-action svg{width:18px;height:18px;flex:none;}
  @media (min-width:640px){ .top-action{top:92px;} }
  .me-select option{color:#151a22;background:#fff;}

  .layout{flex:1;display:flex;min-height:0;}
  .rail{
    display:none;
    flex:none;width:210px;
    border-right:1px solid var(--border-soft);
    background:var(--surface);
    padding:16px 10px;
    flex-direction:column;gap:2px;
  }
  .rail-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:var(--radius-s);
    color:var(--ink-soft);text-decoration:none;cursor:pointer;border:none;background:none;
    font-size:14.5px;font-weight:600;width:100%;text-align:left;
  }
  .rail-item svg{width:19px;height:19px;flex:none;}
  .rail-item:hover{background:var(--surface-2);color:var(--ink);}
  .rail-item.active{background:var(--accent-soft);color:var(--accent);}
  .rail-foot{margin-top:auto;padding:10px 12px;font-size:11.5px;color:var(--ink-faint);border-top:1px solid var(--border-soft);}

  .main{flex:1;min-width:0;overflow-y:auto;padding:18px 16px 90px;}
  @media (min-width:640px){ .main{padding:22px 26px 40px;} }
  .view-wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}

  .tabbar{
    position:sticky;bottom:0;z-index:20;
    display:flex;background:var(--surface);
    border-top:1px solid var(--border-soft);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tab-item{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 1px;border:none;background:none;color:var(--ink-faint);
    font-size:10px;font-weight:600;letter-spacing:.01em;
  }
  .tab-item svg{width:20px;height:20px;flex:none;}
  .tab-item span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tab-item.active{color:var(--accent);}

  @media (min-width:860px){
    .rail{display:flex;}
    .tabbar{display:none;}
    .topbar-title{display:block;}
    .me-label{display:block;}
  }

  /* ---------- buttons & chips ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);
    font-size:13.5px;font-weight:600;padding:9px 16px;cursor:pointer;
    white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-quiet{border-color:transparent;background:transparent;color:var(--ink-soft);}
  .btn-quiet:hover{background:var(--surface-2);color:var(--ink);}
  .btn-danger{border-color:var(--danger);color:var(--danger);background:transparent;}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .icon-btn{
    width:34px;height:34px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
    flex:none;
  }
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}

  .chip-row{display:flex;gap:7px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:999px;padding:6.5px 13px;font-size:12.5px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  :root[data-theme="dark"] .chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);} }

  /* ---------- pills / badges ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:5px;
    border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
  }
  .pill-booked{background:var(--st-booked-soft);color:var(--st-booked);}
  .pill-in_progress{background:var(--st-progress-soft);color:var(--st-progress);}
  .pill-completed{background:var(--st-completed-soft);color:var(--st-completed);}
  .pill-invoiced{background:var(--st-invoiced-soft);color:var(--st-invoiced);}
  .pill-draft{background:var(--steel-soft);color:var(--steel);}
  .pill-sent{background:var(--st-completed-soft);color:var(--st-completed);}
  .pill-queued{background:var(--st-progress-soft);color:var(--st-progress);}
  .badge-type{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-soft);
    background:var(--surface-2);border-radius:6px;padding:3px 8px;
  }
  .ref-tag{
    display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border-radius:6px;padding:3px 8px;letter-spacing:.01em;
  }

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);border:1px solid var(--border-soft);
    border-radius:var(--radius-m);box-shadow:var(--shadow-1);
  }
  .card-pad{padding:16px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px;}
  .section-title{font-family:var(--font-display);font-size:17px;font-weight:700;}
  .section-sub{font-size:12.5px;color:var(--ink-faint);}
  .empty{
    text-align:center;padding:36px 20px;color:var(--ink-faint);font-size:13.5px;
    border:1.5px dashed var(--border);border-radius:var(--radius-m);
  }

  /* ---------- schedule ---------- */
  .date-nav{display:flex;align-items:center;gap:10px;}
  .date-nav h2{font-size:21px;}
  .day-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 6px;}
  .day-chip{
    flex:none;width:52px;padding:8px 0;border-radius:var(--radius-s);
    border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:center;
  }
  .day-chip .dow{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;}
  .day-chip .dom{font-family:var(--font-display);font-size:19px;font-weight:700;margin-top:1px;}
  .day-chip .mk{width:5px;height:5px;border-radius:50%;background:var(--accent);margin:4px auto 0;visibility:hidden;}
  .day-chip.has-jobs .mk{visibility:visible;}
  .day-chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .day-chip.active .dow{color:currentColor;opacity:.72;}
  :root[data-theme="dark"] .day-chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .day-chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}}

  .job-row{
    display:flex;gap:12px;padding:13px 14px;background:var(--surface);
    border:1px solid var(--border-soft);border-radius:var(--radius-m);cursor:pointer;
    box-shadow:var(--shadow-1);align-items:stretch;
  }
  .job-row:hover{border-color:var(--border);}
  .job-time{
    flex:none;width:64px;font-family:var(--font-mono);font-size:12.5px;font-weight:600;
    color:var(--ink-soft);display:flex;flex-direction:column;justify-content:center;gap:2px;
  }
  .job-bar{flex:none;width:4px;border-radius:3px;}
  .job-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .job-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .job-cust{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .job-meta{font-size:12.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;}
  .job-meta .staff-tag{display:flex;align-items:center;gap:5px;}
  .job-meta .sw{width:8px;height:8px;border-radius:50%;flex:none;}
  .job-addr{font-size:12px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;}
  .week-col{min-width:150px;}
  .week-col-head{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
  .week-job{
    background:var(--surface);border:1px solid var(--border-soft);border-left:3px solid var(--st-booked);
    border-radius:8px;padding:8px 9px;margin-bottom:7px;cursor:pointer;font-size:12px;
  }
  .week-job .wj-time{font-family:var(--font-mono);font-weight:600;color:var(--ink-soft);font-size:11px;}
  .week-job .wj-cust{font-weight:700;margin-top:2px;}

  /* ---------- time ---------- */
  .timer-card{
    background:linear-gradient(155deg, var(--steel), #1f2733);
    color:#f2f4f7;border-radius:var(--radius-l);padding:18px 18px;
    display:flex;flex-direction:column;gap:10px;
  }
  :root[data-theme="dark"] .timer-card{background:linear-gradient(155deg, #232c3a, #12161d);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .timer-card{background:linear-gradient(155deg, #232c3a, #12161d);}}
  .timer-card .tc-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#b7c1cf;}
  .timer-card .tc-job{font-family:var(--font-display);font-size:22px;font-weight:700;}
  .timer-card .tc-elapsed{font-family:var(--font-mono);font-size:34px;font-weight:600;letter-spacing:.02em;}
  .timer-idle{
    border:1.5px dashed var(--border);border-radius:var(--radius-l);padding:20px;
    display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--ink-soft);
  }
  .staff-day-block{border-bottom:1px solid var(--border-soft);padding:11px 0;}
  .staff-day-block:last-child{border-bottom:none;}
  .sdb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
  .sdb-total{font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--ink-soft);}
  .te-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px;}
  .te-desc{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .te-dur{font-family:var(--font-mono);font-weight:600;flex:none;}

  .week-bar-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .wbr-label{width:76px;flex:none;font-size:12.5px;font-weight:600;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wbr-track{flex:1;height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
  .wbr-fill{height:100%;border-radius:5px;background:var(--accent);}
  .wbr-val{width:52px;flex:none;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}

  /* ---------- invoicing ---------- */
  .xero-card{
    display:flex;gap:12px;align-items:flex-start;padding:14px 16px;
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);
  }
  .xero-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);margin-top:5px;flex:none;}
  .xero-dot.xero-dot-ok{background:var(--st-completed);}
  .xero-card h3{font-size:14.5px;margin-bottom:3px;}
  .xero-card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
  .xero-details{margin-top:9px;font-size:12.5px;color:var(--ink-soft);line-height:1.7;}
  .xero-details ol{margin:6px 0 0;padding-left:18px;}

  .inv-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border-soft);border-radius:var(--radius-m);background:var(--surface);cursor:pointer;}
  .inv-row-main{flex:1;min-width:0;}
  .inv-row-cust{font-weight:700;font-size:14px;}
  .inv-row-sub{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .inv-row-amt{font-family:var(--font-mono);font-weight:700;font-size:15px;flex:none;}

  .line-item-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
  .line-item-row:last-of-type{border-bottom:none;}
  .li-desc{color:var(--ink);white-space:pre-line;}
  .li-desc small{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:1px;}
  .li-amt{font-family:var(--font-mono);font-weight:600;flex:none;}
  .totals-block{margin-top:8px;padding-top:8px;}
  .totals-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);padding:3px 0;}
  .totals-row.grand{font-size:16px;font-weight:700;color:var(--ink);padding-top:7px;}

  /* ---------- staff ---------- */
  .staff-card{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);}
  .avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:none;font-family:var(--font-display);}
  .staff-card-name{font-weight:700;font-size:14.5px;}
  .staff-card-role{font-size:12px;color:var(--ink-soft);}
  .staff-card-phone{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);}
  .staff-inactive{opacity:.55;}

  .cust-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);box-shadow:var(--shadow-1);padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
  .cust-card:hover{border-color:var(--border);}
  .cust-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-soft);}
  .cust-meta-item{display:inline-flex;align-items:center;gap:5px;}
  .cust-meta-item svg{width:13px;height:13px;flex:none;color:var(--ink-faint);}
  .job-addr svg{width:12px;height:12px;vertical-align:-1px;color:var(--ink-faint);flex:none;}
  .vehicle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--border-soft);}
  .vehicle-row:last-of-type{border-bottom:none;}

  /* ---------- forms ---------- */
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .field input, .field select, .field textarea{
    border:1px solid var(--border);border-radius:var(--radius-s);padding:9px 11px;background:var(--surface);color:var(--ink);width:100%;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (max-width:360px){ .field-row3{grid-template-columns:1fr 1fr;} }
  svg{flex:none;}
  .timer-idle-icon{display:inline-flex;width:34px;height:34px;color:var(--ink-faint);}
  .timer-idle-icon svg{width:100%;height:100%;}
  .inline-ico{display:inline-flex;width:14px;height:14px;flex:none;vertical-align:-2px;}
  .inline-ico svg{width:100%;height:100%;}

  /* ---------- invoice photos ---------- */
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .photo-thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--border-soft);cursor:pointer;flex:none;background:var(--surface-2);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb-remove{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:999px;border:none;background:rgba(20,20,24,.65);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .photo-thumb-remove svg{width:12px;height:12px;}
  .photo-add-btn{width:72px;height:72px;border-radius:10px;border:1.5px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-faint);cursor:pointer;flex:none;text-align:center;font-size:10.5px;font-weight:600;}
  .photo-add-btn svg{width:18px;height:18px;}
  .photo-lightbox-backdrop{position:fixed;inset:0;background:rgba(10,12,16,.82);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;}
  .photo-lightbox-panel{position:relative;max-width:min(92vw,720px);max-height:88vh;}
  .photo-lightbox-panel img{max-width:100%;max-height:88vh;border-radius:10px;display:block;}
  .photo-lightbox-close{position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:999px;border:none;background:#fff;color:#1a1f27;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-2);}
  .photo-lightbox-close svg{width:16px;height:16px;}
  form{display:flex;flex-direction:column;gap:12px;}
  .swatches{display:flex;flex-wrap:wrap;gap:8px;}
  .swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;position:relative;}
  .swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;}
  .swatch.checked, .swatch:has(input:checked){border-color:var(--ink);}
  :root[data-theme="dark"] .swatch.checked, :root[data-theme="dark"] .swatch:has(input:checked){border-color:#fff;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .swatch.checked, :root:not([data-theme="light"]) .swatch:has(input:checked){border-color:#fff;}}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}
  .check-row input{width:auto;}
  .helptext{font-size:11.5px;color:var(--ink-faint);}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(12,15,20,.5);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
    padding:0;
  }
  @media (min-width:640px){ .modal-backdrop{align-items:center;padding:20px;} }
  .modal-panel{
    background:var(--surface);width:100%;max-width:520px;max-height:92vh;
    border-radius:20px 20px 0 0;overflow-y:auto;box-shadow:var(--shadow-2);
    display:flex;flex-direction:column;
  }
  @media (min-width:640px){ .modal-panel{border-radius:var(--radius-l);max-height:88vh;} }
  .modal-head{
    position:sticky;top:0;background:var(--surface);z-index:1;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 18px;border-bottom:1px solid var(--border-soft);
  }
  .modal-head h3{font-size:18px;}
  .modal-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:16px;}
  .modal-foot{display:flex;gap:9px;padding:14px 18px;border-top:1px solid var(--border-soft);position:sticky;bottom:0;background:var(--surface);}
  .divider{height:1px;background:var(--border-soft);border:none;margin:2px 0;}
  .status-stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  /* ---------- delete confirmation popup ---------- */
  .confirm-backdrop{
    position:fixed;inset:0;background:rgba(12,15,20,.55);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-panel{
    background:var(--surface);width:100%;max-width:340px;border-radius:var(--radius-l);
    box-shadow:var(--shadow-2);padding:22px 20px 18px;text-align:center;
  }
  .confirm-icon{
    width:44px;height:44px;border-radius:50%;margin:0 auto 12px;
    background:var(--danger-soft);color:var(--danger);
    display:flex;align-items:center;justify-content:center;
  }
  .confirm-icon svg{width:20px;height:20px;}
  .confirm-panel h3{font-size:17px;font-weight:700;margin-bottom:6px;}
  .confirm-panel p{font-size:13.5px;color:var(--ink-soft);line-height:1.45;}
  .confirm-actions{display:flex;gap:9px;margin-top:18px;}
  .confirm-actions .btn{flex:1;}

  /* ---------- misc ---------- */
  .toast{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;
    font-size:13px;font-weight:600;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;z-index:80;white-space:nowrap;
  }
  :root[data-theme="dark"] .toast{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .overflow-x{overflow-x:auto;}
  .stack-sm{display:flex;flex-direction:column;gap:8px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
</style>
</head>

function createRestDb(apiBase){
  var listeners = {};   // collection name -> [{onNext, onError}]
  var pollTimers = {};
  function toSnap(data){
    return { docs: (data.docs||[]).map(function(d){ return { data: function(){ return d; } }; }) };
  }
  function pollOnce(name){
    return fetch(apiBase+'/collections/'+name, {credentials:'same-origin'}).then(function(r){
      if(!r.ok) throw new Error('fetch '+name+' failed: '+r.status);
      return r.json();
    }).then(function(data){
      var snap = toSnap(data);
      (listeners[name]||[]).forEach(function(l){ l.onNext(snap); });
      return snap;
    }).catch(function(e){
      (listeners[name]||[]).forEach(function(l){ if(l.onError) l.onError(e); });
      throw e;
    });
  }
  function collectionRef(name){
    return {
      get: function(){ return pollOnce(name); },
      doc: function(id){
        return {
          set: function(obj){
            return fetch(apiBase+'/collections/'+name+'/'+encodeURIComponent(id), {
              method:'PUT', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)
            }).then(function(r){
              if(!r.ok) throw new Error('save '+name+' failed: '+r.status);
              return pollOnce(name); // refresh right away so the UI doesn't wait for the next poll tick
            });
          },
          delete: function(){
            return fetch(apiBase+'/collections/'+name+'/'+encodeURIComponent(id), {method:'DELETE', credentials:'same-origin'})
              .then(function(r){
                if(!r.ok) throw new Error('delete '+name+' failed: '+r.status);
                return pollOnce(name);
              });
          }
        };
      },
      onSnapshot: function(onNext, onError){
        if(!listeners[name]) listeners[name] = [];
        listeners[name].push({onNext:onNext, onError:onError});
        pollOnce(name);
        if(!pollTimers[name]){
          // Picks up changes made by other staff/devices. Not instant like
          // the old realtime db, but the every-write refresh above (and the
          // 4s tick) keeps things feeling live for a small shared team.
          pollTimers[name] = setInterval(function(){ pollOnce(name); }, 4000);
        }
      }
    };
  }
  return { collection: collectionRef };
}
function createRestAssets(apiBase){
  return {
    upload: function(blob){
      return fetch(apiBase+'/photos', {
        method:'POST', credentials:'same-origin',
        headers: {'Content-Type': (blob && blob.type) || 'image/jpeg'},
        body: blob
      }).then(function(r){
        if(!r.ok) throw new Error('photo upload failed: '+r.status);
        return r.json(); // {id, url, contentType}
      });
    }
  };
}

/* Catalog collections (services/products) need the full seed list present in the db
   even when the app itself was already seeded long ago (seedDb() only runs once, the
   first time 'staff' is empty). Otherwise the moment anyone edits or adds a single
   item, that collection's onSnapshot returns just that one doc and silently wipes
   out every other un-persisted catalog item from view. This backfills any seed item
   whose id isn't already in the db — safe to call every load, never touches existing docs. */
async function seedCatalogIfMissing(coll, seedArr){
  try{
    var snap = await db.collection(coll).get();
    var existing = {};
    snap.docs.forEach(function(d){ existing[d.data().id] = true; });
    var writes = [];
    seedArr.forEach(function(item){
      if(!existing[item.id]) writes.push(db.collection(coll).doc(item.id).set(item));
    });
    if(writes.length) await Promise.all(writes);
  }catch(e){ console.warn('catalog backfill failed for '+coll, e); }
}

async function seedDb(){
  seededOnce = true;
  try{
    var writes = [];
    SEED_STAFF.forEach(function(s){ writes.push(db.collection('staff').doc(s.id).set(s)); });
    var bookings = buildSeedBookings();
    bookings.forEach(function(b){ writes.push(db.collection('bookings').doc(b.id).set(b)); });
    var tEntries = buildSeedTime();
    tEntries.forEach(function(te){ writes.push(db.collection('timeEntries').doc(te.id).set(te)); });
    var invs = buildSeedInvoices();
    invs.forEach(function(iv){ writes.push(db.collection('invoices').doc(iv.id).set(iv)); });
    SEED_CUSTOMERS.forEach(function(c){ writes.push(db.collection('customers').doc(c.id).set(c)); });
    SEED_SERVICES.forEach(function(sv){ writes.push(db.collection('services').doc(sv.id).set(sv)); });
    SEED_PRODUCTS.forEach(function(pr){ writes.push(db.collection('products').doc(pr.id).set(pr)); });
    await Promise.all(writes);
    var staffSnap = await db.collection('staff').get();
    state.staff = staffSnap.docs.map(function(d){ return d.data(); });
    render();
  }catch(e){ console.warn('seed failed', e); }
}

/* The Xero connector's address used to be something each user had to paste
   in themselves (see the old SETUP.md) because the Artifact-hosted version
   of this app had no backend of its own to keep it in. Now the app has a
   real backend, and it already knows the connector's address (an env var

async function refreshXeroStatus(){
  state.xeroStatusLoading = true;
  try{
    var res = await fetch('/api/xero/status', {credentials:'same-origin'});
    if(!res.ok) throw new Error('bad response');

function xeroErrorMessage(data){
  if(!data) return 'unknown error';
  if(data.error==='not_connected') return 'not connected yet — connect in Account first';
  if(data.error==='reauth_required') return 'Xero login expired — reconnect in Account';
  if(data.message) return data.message;
  return data.error || 'unknown error';
}
function handleXeroRedirectParams(){
  var params;
  try{ params = new URLSearchParams(window.location.search); }catch(e){ return; }
  if(!params.has('xero')) return;
  var status = params.get('xero');
  if(status==='connected') toast('Connected to Xero');
  else if(status==='error') toast('Xero connection failed — '+(params.get('xeroDetail')||'unknown error'));
  params.delete('xero'); params.delete('xeroDetail');
  var qs = params.toString();
  var newUrl = window.location.pathname + (qs?('?'+qs):'') + window.location.hash;
  window.history.replaceState({}, '', newUrl);
  refreshXeroStatus();
}
function localMutate(coll, doc){
  var arr = state[coll];
  var idx = arr.findIndex(function(x){ return x.id===doc.id; });
  if(idx>=0) arr[idx]=doc; else arr.push(doc);

  if(!db) render();
}

  if(strip.indexOf(state.selectedDate)===-1){ strip.push(state.selectedDate); strip.sort(); }

    var cls = 'day-chip' + (iso===state.selectedDate?' active':'') + (has?' has-jobs':'');
    return '<button class="'+cls+'" data-action="change-date" data-date="'+iso+'">' +
      '<div class="dow">'+info.dow+'</div><div class="dom">'+info.dom+'</div><div class="mk"></div></button>';

      return '<button class="chip'+(state.staffFilter===s.id?' active':'')+'" data-action="set-staff-filter" data-staff="'+s.id+'">'+
        '<span class="dot" style="background:'+s.color+'"></span>'+escapeHtml(s.name.split(' ')[0])+'</button>';
    }).join('');

  var modeToggle = '<div class="chip-row">' +
    '<button class="chip'+(state.scheduleMode==='day'?' active':'')+'" data-action="set-schedule-mode" data-mode="day">Day</button>' +
    '<button class="chip'+(state.scheduleMode==='week'?' active':'')+'" data-action="set-schedule-mode" data-mode="week">Week</button>' +

    '<div class="section-head">' +
      '<div class="section-title">Schedule</div>' +
    '</div>' +
    '<div class="row-between">' +
      '<div class="date-nav">' +

/* ===================== TIME ===================== */
function timeView(){
  var timerCard = state.timer ? runningTimerHTML() : idleTimerHTML();
  var todayEntries = state.timeEntries.filter(function(t){ return t.date===todayISO(); });
  var byStaff = {};
  todayEntries.forEach(function(t){ (byStaff[t.staffId] = byStaff[t.staffId]||[]).push(t); });
  var staffIds = Object.keys(byStaff);

  var todaySection;
  if(staffIds.length===0){
    todaySection = '<div class="empty">No time logged yet today.</div>';
  } else {
    todaySection = staffIds.map(function(sid){
      var entries = byStaff[sid];
      var total = entries.reduce(function(a,t){return a+t.minutes;},0);
      return '<div class="staff-day-block">' +
        '<div class="sdb-head"><span class="staff-tag"><span class="sw" style="background:'+staffColor(sid)+'"></span><strong>'+escapeHtml(staffName(sid))+'</strong></span><span class="sdb-total">'+fmtHrsMin(total)+'</span></div>' +
        entries.map(function(t){
          var b = getBooking(t.bookingId);
          var itemName = b ? bookingItemLabel(b, t.itemId) : null;
          return '<div class="te-row"><span class="te-desc">'+(b?escapeHtml(b.customer.name):'—')+(itemName?' · '+escapeHtml(itemName):'')+(t.note?' · '+escapeHtml(t.note):'')+'</span><span class="te-dur">'+fmtHrsMin(t.minutes)+'</span></div>';
        }).join('') +
      '</div>';
    }).join('');
  }

  // week summary (last 7 days including today)
  var weekStart = addDays(todayISO(),-6);
  var weekTotals = {};
  state.timeEntries.forEach(function(t){
    if(t.date>=weekStart && t.date<=todayISO()){
      weekTotals[t.staffId] = (weekTotals[t.staffId]||0) + t.minutes;
    }
  });
  var maxMin = Math.max.apply(null, Object.values(weekTotals).concat([1]));
  var weekBars = state.staff.filter(function(s){return s.active;}).map(function(s){
    var mins = weekTotals[s.id]||0;
    var pct = Math.round((mins/maxMin)*100);
    return '<div class="week-bar-row"><span class="wbr-label">'+escapeHtml(s.name.split(' ')[0])+'</span>' +
      '<div class="wbr-track"><div class="wbr-fill" style="width:'+pct+'%;background:'+s.color+'"></div></div>' +
      '<span class="wbr-val">'+fmtHrsMin(mins)+'</span></div>';
  }).join('');

  return '' +
    timerCard +
    '<div class="card card-pad">' +
      '<div class="row-between"><div class="section-title">Today\'s time</div><button class="btn btn-sm" data-action="log-time-manual">'+ICONS.plus+' Log time</button></div>' +
      '<div style="margin-top:10px">'+todaySection+'</div>' +
    '</div>' +
    '<div class="card card-pad">' +
      '<div class="section-title">This week by staff</div>' +
      '<div style="margin-top:8px">'+weekBars+'</div>' +
    '</div>';
}

function elapsedLabel(startedAt){
  var s = Math.max(0, Math.floor((Date.now()-startedAt)/1000));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return pad2(h)+':'+pad2(m)+':'+pad2(sec);
}

/* ===================== INVOICING ===================== */
function invoicingView(){
  var invoicedIds = state.invoices.map(function(i){ return i.bookingId; });
  var ready = state.bookings.filter(function(b){ return b.status==='completed' && invoicedIds.indexOf(b.id)===-1; });
  var sent = state.invoices.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  var xeroConnected = !!(state.xeroStatus && state.xeroStatus.connected);
  var xero;
  if(xeroConnected){
    xero = '<div class="xero-card">' +
      '<div class="xero-dot xero-dot-ok"></div>' +
      '<div style="flex:1">' +
        '<h3>Xero — connected'+(state.xeroStatus.tenantName?' to '+escapeHtml(state.xeroStatus.tenantName):'')+'</h3>' +
        '<p>"Send to Xero" below creates a real draft invoice (with photos attached) in your Xero organisation, immediately.</p>' +
      '</div>' +
    '</div>';
  } else {
    xero = '<div class="xero-card">' +
      '<div class="xero-dot"></div>' +
      '<div style="flex:1">' +
        '<h3>Xero — not connected yet</h3>' +
        '<p>Invoices you send here are recorded in this app. Nothing is pushed to Xero yet — head to Account to connect your Xero organisation (one click, no setup needed).</p>' +
      '</div>' +
    '</div>';
  }

  var readySection = ready.length ? '<div class="stack-sm">' + ready.map(function(b){
    var mins = minutesFor(b.id);
    var unlinkedMins = unlinkedMinutesFor(b.id);
    var itemsAmt = (b.serviceItems||[]).reduce(function(a,it){ return a+(it.price||0); },0);
    var amt = (unlinkedMins/60)*b.rate + itemsAmt;
    return '<div class="inv-row" data-action="build-invoice" data-booking="'+b.id+'">' +
      '<div class="inv-row-main"><div class="inv-row-cust">'+escapeHtml(b.customer.name)+'</div>' +
      '<div class="inv-row-sub">'+escapeHtml(joinParts([b.reference||'—', b.vehicle.rego, fmtHrsMin(mins)+' logged', fmtDateShort(b.date)]))+'</div></div>' +
      '<div class="inv-row-amt">'+fmtMoney(amt)+'</div>' +
    '</div>';
  }).join('') + '</div>' : '<div class="empty">No completed jobs waiting to invoice.</div>';

  var sentSection = sent.length ? '<div class="stack-sm">' + sent.map(function(iv){
    return '<div class="inv-row" data-action="view-invoice" data-id="'+iv.id+'">' +
      '<div class="inv-row-main"><div class="inv-row-cust">'+escapeHtml(iv.customerName)+'</div>' +
      '<div class="inv-row-sub"><span class="pill pill-'+invoiceStatusPill(iv).cls+'">'+invoiceStatusPill(iv).label+'</span> · '+escapeHtml(iv.reference||'—')+' · '+fmtDateShort(isoLocalDate(new Date(iv.createdAt)))+'</div></div>' +
      '<div class="inv-row-amt">'+fmtMoney(iv.total)+'</div>' +
    '</div>';
  }).join('') + '</div>' : '<div class="empty">No invoices yet.</div>';

  return '' +
    xero +
    '<div><div class="section-head"><div class="section-title">Ready to invoice</div><div class="section-sub">'+ready.length+' job'+(ready.length===1?'':'s')+'</div></div><div style="margin-top:8px">'+readySection+'</div></div>' +
    '<div><div class="section-head"><div class="section-title">Invoice history</div><div class="section-sub">'+sent.length+'</div></div><div style="margin-top:8px">'+sentSection+'</div></div>';

  var connected = !!(status && status.connected);
  var xeroBody;
  if(state.xeroStatusLoading){
    xeroBody = '<div class="helptext">Checking connection…</div>';

    xeroBody = '<div class="row-between"><div><strong>Connected</strong>' +
        (status.tenantName ? '<div class="helptext">'+escapeHtml(status.tenantName)+'</div>' : '') +
      '</div><button type="button" class="btn btn-sm" data-action="xero-disconnect">Disconnect</button></div>';
  } else if(status && status.error){
    xeroBody = '<div class="row-between"><div class="helptext">Could not reach the Xero connector right now.</div>' +

/* ===================== MODAL ROUTER ===================== */
function modalHTML(){
  var m = state.modal;
  if(m.type==='booking') return bookingModalHTML(m);
  if(m.type==='staff') return staffModalHTML(m);
  if(m.type==='service') return serviceItemModalHTML(m);
  if(m.type==='product') return productItemModalHTML(m);
  if(m.type==='customer') return customerModalHTML(m);
  if(m.type==='invoice') return invoiceModalHTML(m);
  if(m.type==='timerPick') return timerPickModalHTML();
  if(m.type==='logTime') return logTimeModalHTML();
  if(m.type==='stopTimer') return stopTimerModalHTML();
  if(m.type==='servicePicker') return serviceCatalogModalHTML();
  if(m.type==='productPicker') return productCatalogModalHTML();
  return '';
}
function modalShell(title, bodyHtml, footHtml){
  return '<div class="modal-backdrop" id="modal-backdrop">' +
    '<div class="modal-panel">' +
      '<div class="modal-head"><h3>'+title+'</h3><button class="icon-btn" data-action="close-modal">'+ICONS.close+'</button></div>' +
      '<div class="modal-body">'+bodyHtml+'</div>' +
      (footHtml ? '<div class="modal-foot">'+footHtml+'</div>' : '') +
    '</div>' +
  '</div>';
}

/* ---- booking modal ---- */

    state.bookingDraft = {key: draftKey, serviceItems: (b && b.serviceItems) ? b.serviceItems.slice() : []};
  }
  var prefillDate = (m.prefill && m.prefill.date) || state.selectedDate;
  var staffOptions = state.staff.filter(function(s){return s.active;}).map(function(s){
    var sel = b ? (b.staffId===s.id) : (m.prefill && m.prefill.staffId===s.id);
    return '<option value="'+s.id+'"'+(sel?' selected':'')+'>'+escapeHtml(s.name)+'</option>';
  }).join('');

    var sel = b ? b.jobType===t : t==='mechanical';

  var form = '<form id="booking-form" data-form="booking" data-id="'+(b?b.id:'')+'">' +

    '</div>' +
    '<div class="field-row">' +
      '<div class="field"><label>Reference #</label><input type="text" name="reference" class="mono" value="'+(b?escapeHtml(b.reference||''):'')+'" placeholder="e.g. '+nextJobRef()+' or a PO number" required></div>' +

    '<div class="field-row">' +
      '<div class="field"><label>Customer name</label><input type="text" id="cust-name-input" name="custName" list="customer-names-list" value="'+(b?escapeHtml(b.customer.name):'')+'" required></div>' +

    '<div class="helptext" id="cust-match-hint" style="'+(getCustomer((b||{}).customerId)?'':'display:none')+'">Matches an existing contact — their saved details will fill in.</div>' +

    '<div class="field-row">' +
      '<div class="field"><label>Vehicle rego</label><input type="text" name="rego" value="'+(b?escapeHtml(b.vehicle.rego):'')+'"></div>' +
      '<div class="field"><label>Make / model</label><input type="text" name="makeModel" value="'+(b?escapeHtml(b.vehicle.makeModel):'')+'"></div>' +
    '</div>' +

    '<div class="field"><label>Job address</label><input type="text" name="address" value="'+(b?escapeHtml(b.address):'')+'" required></div>' +

function serviceLabel(s){ return s.code + ' · ' + s.name; }
function findServiceByLabel(label){
  if(!label) return null;
  var t = label.trim();
  if(!t) return null;
  return state.services.find(function(s){ return serviceLabel(s)===t; }) || null;
}
function bookingServiceItemsHTML(){
  var items = (state.bookingDraft && state.bookingDraft.serviceItems) || [];
  if(!items.length) return '<div class="helptext">No job items attached yet.</div>';
  return items.map(function(it,i){
    var durTag = it.durationMins ? ' <span class="helptext">('+fmtHrsMin(it.durationMins)+')</span>' : '';
    return '<div class="vehicle-row"><span style="flex:1">'+escapeHtml(it.name)+durTag+'</span><span class="mono" style="font-weight:700">'+(it.price!=null?fmtMoney(it.price):'—')+'</span>' +
      '<button type="button" class="icon-btn" style="width:24px;height:24px" data-action="remove-booking-service" data-idx="'+i+'">'+ICONS.close+'</button></div>';
  }).join('');
}
function bumpBookingEndTime(deltaMins){
  if(!deltaMins) return;
  var endInput = document.querySelector('#booking-form [name=end]');
  if(!endInput) return;
  var parts = (endInput.value||'17:00').split(':');
  var total = Number(parts[0])*60 + Number(parts[1]) + deltaMins;
  total = ((total % 1440) + 1440) % 1440;
  endInput.value = pad2(Math.floor(total/60))+':'+pad2(total%60);
}

function statusStepperHTML(b){
  var buttons = '';
  if(b.status==='booked') buttons += '<button type="button" class="btn btn-sm" data-action="set-status" data-id="'+b.id+'" data-status="in_progress">Start job →</button>';
  if(b.status==='in_progress'){
    buttons += '<button type="button" class="btn btn-sm" data-action="set-status" data-id="'+b.id+'" data-status="completed">Mark complete →</button>';
    buttons += '<button type="button" class="btn btn-quiet btn-sm" data-action="set-status" data-id="'+b.id+'" data-status="booked">Back to booked</button>';
  }
  if(b.status==='completed'){
    buttons += '<button type="button" class="btn btn-quiet btn-sm" data-action="set-status" data-id="'+b.id+'" data-status="in_progress">Back to in progress</button>';
  }
  return '<div class="card card-pad"><div class="row-between"><span class="section-sub">Status</span>'+pillHTML(b.status)+'</div>' +
    '<div class="status-stepper" style="margin-top:9px">'+buttons+'</div></div>';
}

function timeTrackingBlockHTML(b){
  var entries = timeEntriesFor(b.id);
  var total = minutesFor(b.id);
  var unlinked = unlinkedMinutesFor(b.id);
  var rows = entries.length ? entries.map(function(t){
    var itemName = bookingItemLabel(b, t.itemId);
    return '<div class="te-row"><span class="te-desc">'+escapeHtml(staffName(t.staffId))+(itemName?' · '+escapeHtml(itemName):'')+(t.note?' · '+escapeHtml(t.note):'')+'</span>' +
      '<span style="display:flex;align-items:center;gap:8px"><span class="te-dur">'+fmtHrsMin(t.minutes)+'</span>' +
      '<button type="button" class="icon-btn" style="width:24px;height:24px" data-action="delete-time" data-id="'+t.id+'">'+ICONS.close+'</button></span></div>';
  }).join('') : '<div class="helptext">No time logged yet.</div>';

  var runningBanner = '';
  if(state.timer && state.timer.bookingId===b.id){
    runningBanner = '<div class="timer-card" style="margin-bottom:10px">' +
      '<div class="tc-label">Timer running · '+escapeHtml(staffName(state.timer.staffId))+'</div>' +
      '<div class="tc-elapsed mono timer-elapsed-el">'+elapsedLabel(state.timer.startedAt)+'</div>' +
      '<div><button type="button" class="btn btn-primary" data-action="stop-timer" style="background:#fff;color:#1a1f27;border-color:#fff">'+ICONS.stop+' Stop &amp; log</button></div>' +
    '</div>';
  } else if(state.timer && state.timer.bookingId!==b.id){
    var otherB = getBooking(state.timer.bookingId);
    runningBanner = '<div class="helptext" style="margin-bottom:8px;display:flex;align-items:center;gap:6px"><span class="inline-ico">'+ICONS.clock+'</span> Timer is running on a different job'+(otherB?' ('+escapeHtml(otherB.customer.name)+')':'')+'.</div>';
  } else if(b.status==='in_progress'){
    runningBanner = '<button type="button" class="btn btn-sm" style="margin-bottom:10px" data-action="start-timer" data-id="'+b.id+'">'+ICONS.play+' Start timer for this job</button>';
  }

  return '<div class="card card-pad">' +
    '<div class="row-between"><span class="section-sub">Time logged</span><span class="mono" style="font-weight:700">'+fmtHrsMin(total)+' · '+fmtMoney((unlinked/60)*b.rate)+'</span></div>' +
    runningBanner +
    '<div style="margin-top:6px">'+rows+'</div>' +
  '</div>';
}

function resizeImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width*scale));
        var h = Math.max(1, Math.round(img.height*scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl;
        try{ dataUrl = canvas.toDataURL('image/jpeg', quality); }
        catch(err){ reject(err); return; }
        if(canvas.toBlob){
          canvas.toBlob(function(blob){ resolve({dataUrl: dataUrl, blob: blob}); }, 'image/jpeg', quality);
        } else {
          resolve({dataUrl: dataUrl, blob: null});
        }
      };
      img.onerror = function(){ reject(new Error('Could not read image')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('Could not read file')); };
    reader.readAsDataURL(file);
  });
}
/* Uploads one photo's blob through the 'assets' capability in the background
   and records the resulting URL onto that photo entry once it resolves. Kept
   separate (rather than awaited inline) so adding a photo to the draft stays
   instant — the thumbnail already has its dataUrl to display immediately.
   Takes 'photo' as a parameter (not a closed-over loop variable) so each
   upload updates the right entry even when several photos are added at once. */
function uploadPhotoAsset(photo, blob){
  if(!assetsCap || !blob) return Promise.resolve();
  return assetsCap.upload(blob).then(function(res){
    photo.assetId = res.id;
    photo.assetUrl = res.url;
  }).catch(function(e){ console.warn('photo upload failed', e); });
}
async function addInvoicePhotos(fileList){
  if(!state.invoiceDraft) return;
  var files = Array.prototype.filter.call(fileList, function(f){ return f.type.indexOf('image/')===0; });
  if(!files.length){ toast('Please choose an image file'); return; }
  var room = INVOICE_PHOTO_MAX - state.invoiceDraft.photos.length;
  if(room<=0){ toast('Up to '+INVOICE_PHOTO_MAX+' photos per invoice'); return; }
  if(files.length>room) files = files.slice(0, room);
  var added = 0;
  for(var i=0;i<files.length;i++){
    try{
      var result = await resizeImageFile(files[i], 1280, 0.6);
      var photo = {id: uid('ph'), dataUrl: result.dataUrl, assetId: null, assetUrl: null};
      state.invoiceDraft.photos.push(photo);
      added++;
      // Not sent to Xero automatically unless this upload succeeds — if
      // 'assets' is unavailable or the upload fails, the photo still works
      // fine inside the app, it just won't auto-attach to the Xero invoice.
      // finalizeInvoice() waits for these before saving, so the invoice it
      // saves always has whatever assetUrl each photo ended up with.
      if(!state.invoiceDraft.photoUploads) state.invoiceDraft.photoUploads = [];
      state.invoiceDraft.photoUploads.push(uploadPhotoAsset(photo, result.blob));
    }catch(e){ console.warn('photo add failed', e); }
  }
  var block = document.getElementById('invoice-photos-block');
  if(block) block.innerHTML = invoicePhotosHTML(state.invoiceDraft.photos, true, 'draft');
  if(added) toast(added>1 ? added+' photos added' : 'Photo added');
  else toast('Could not read that image');
}
function openPhotoLightbox(src){
  var overlay = document.createElement('div');
  overlay.className = 'photo-lightbox-backdrop';
  overlay.innerHTML = '<div class="photo-lightbox-panel">' +
    '<button type="button" class="photo-lightbox-close" aria-label="Close">'+ICONS.close+'</button>' +
    '<img src="'+src+'" alt="Job photo">' +
  '</div>';
  document.body.appendChild(overlay);

  function onKey(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown', onKey);
}

/* ===================== actions ===================== */
function handleAction(el){
  var a = el.dataset.action;
  if(a==='nav'){ state.view = el.dataset.view; state.confirmDelete=null; render(); return; }
  if(a==='new-booking'){ openModal({type:'booking', id:null, prefill:{date:state.selectedDate}}); return; }
  if(a==='open-booking'){ openModal({type:'booking', id:el.dataset.id}); return; }
  if(a==='close-modal'){ closeModal(); return; }
  if(a==='change-date'){ state.selectedDate = el.dataset.date; render(); return; }
  if(a==='shift-date'){
    var delta = Number(el.dataset.delta);
    if(state.scheduleMode==='week') delta *= 7;
    state.selectedDate = addDays(state.selectedDate, delta); render(); return;
  }
  if(a==='set-schedule-mode'){ state.scheduleMode = el.dataset.mode; render(); return; }
  if(a==='set-staff-filter'){ state.staffFilter = el.dataset.staff; render(); return; }
  if(a==='set-jobs-filter'){ state.jobsStatusFilter = el.dataset.status; render(); return; }
  if(a==='set-status'){
    var b = getBooking(el.dataset.id);
    if(b){
      var wasBooked = b.status==='booked';
      var updated = Object.assign({}, b, {status: el.dataset.status}); saveDoc('bookings', updated);
      if(state.modal && state.modal.type==='booking') state.modal = {type:'booking', id:b.id};
      if(wasBooked && el.dataset.status==='in_progress'){
        if(!state.timer){
          state.timer = {bookingId: b.id, staffId: state.meId || b.staffId, startedAt: Date.now()};
          safeSet('bb_timer', JSON.stringify(state.timer));
          render();
          toast('Job started — timer running');
        } else if(state.timer.bookingId!==b.id){
          toast('Job started — timer is still running on a different job');
        }
      }
    }
    return;
  }
  if(a==='ask-delete-booking'){ state.confirmDelete = {type:'booking', id:el.dataset.id, name:el.dataset.name}; render(); return; }
  if(a==='ask-delete-staff'){ state.confirmDelete = {type:'staff', id:el.dataset.id, name:el.dataset.name}; render(); return; }
  if(a==='ask-delete-customer'){ state.confirmDelete = {type:'customer', id:el.dataset.id, name:el.dataset.name}; render(); return; }
  if(a==='cancel-delete'){ state.confirmDelete = null; render(); return; }
  if(a==='confirm-delete-booking'){ var delBookingId=el.dataset.id; closeModal(); removeDoc('bookings', delBookingId); toast('Booking deleted'); return; }
  if(a==='confirm-delete-staff'){ var delStaffId=el.dataset.id; closeModal(); removeDoc('staff', delStaffId); toast('Staff member removed'); return; }
  if(a==='confirm-delete-customer'){ var delCustId=el.dataset.id; closeModal(); removeDoc('customers', delCustId); toast('Customer deleted'); return; }
  if(a==='delete-time'){
    var teId = el.dataset.id;
    removeDoc('timeEntries', teId);
    return;
  }
  if(a==='edit-staff'){ openModal({type:'staff', id:el.dataset.id}); return; }
  if(a==='new-staff'){ openModal({type:'staff', id:null}); return; }
  if(a==='edit-service'){ openModal({type:'service', id:el.dataset.id}); return; }
  if(a==='new-service'){ openModal({type:'service', id:null}); return; }
  if(a==='ask-delete-service'){ state.confirmDelete = {type:'service', id:el.dataset.id, name:el.dataset.name}; render(); return; }
  if(a==='confirm-delete-service'){ var delSvcId=el.dataset.id; closeModal(); removeDoc('services', delSvcId); toast('Service deleted'); return; }
  if(a==='edit-product'){ openModal({type:'product', id:el.dataset.id}); return; }
  if(a==='new-product'){ openModal({type:'product', id:null}); return; }
  if(a==='ask-delete-product'){ state.confirmDelete = {type:'product', id:el.dataset.id, name:el.dataset.name}; render(); return; }
  if(a==='confirm-delete-product'){ var delProdId=el.dataset.id; closeModal(); removeDoc('products', delProdId); toast('Product deleted'); return; }
  if(a==='edit-customer'){ openModal({type:'customer', id:el.dataset.id}); return; }
  if(a==='new-customer'){ openModal({type:'customer', id:null}); return; }
  if(a==='remove-booking-service'){
    var bsIdx = Number(el.dataset.idx);
    if(state.bookingDraft){
      var removedItem = state.bookingDraft.serviceItems[bsIdx];
      state.bookingDraft.serviceItems.splice(bsIdx,1);
      if(removedItem && removedItem.durationMins) bumpBookingEndTime(-removedItem.durationMins);
    }
    var bsChips = document.getElementById('booking-service-chips');
    if(bsChips) bsChips.innerHTML = bookingServiceItemsHTML();
    return;
  }
  if(a==='remove-customer-vehicle'){
    var vIdx = Number(el.dataset.idx);
    if(state.customerDraft) state.customerDraft.vehicles.splice(vIdx,1);
    render(); return;
  }
  if(a==='build-invoice'){ openModal({type:'invoice', id:null, bookingId:el.dataset.booking}); return; }
  if(a==='view-invoice'){ openModal({type:'invoice', id:el.dataset.id}); return; }
  if(a==='view-invoice-for'){
    var inv = state.invoices.find(function(i){return i.bookingId===el.dataset.booking;});
    openModal({type:'invoice', id: inv?inv.id:null}); return;
  }
  if(a==='toggle-xero-info'){ state.xeroInfoOpen = !state.xeroInfoOpen; render(); return; }
  if(a==='xero-connect'){
    var returnUrl = window.location.origin + window.location.pathname;
    fetch('/api/xero/connect-url?return='+encodeURIComponent(returnUrl), {credentials:'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(data){ window.location.href = data.url; })
      .catch(function(){ toast('Could not start the Xero connection — try again'); });
    return;
  }
  if(a==='xero-disconnect'){
    fetch('/api/xero/disconnect', {method:'POST', credentials:'same-origin'}).then(function(){
      toast('Disconnected from Xero');
      refreshXeroStatus();
    }).catch(function(){ toast('Could not disconnect — try again'); });
    return;
  }
  if(a==='refresh-xero-status'){ refreshXeroStatus(); return; }
  if(a==='sign-out'){
    fetch('/api/logout', {method:'POST', credentials:'same-origin'}).then(function(){ window.location.reload(); });
    return;
  }
  if(a==='deactivate-user'){
    var uid2 = el.dataset.id;
    fetch('/api/users/'+encodeURIComponent(uid2), {method:'DELETE', credentials:'same-origin'}).then(function(r){
      if(r.ok){ toast('Login deactivated'); loadUsers(); } else { toast('Could not deactivate that login'); }
    });
    return;
  }
  if(a==='remove-invoice-line'){
    var idx = Number(el.dataset.idx);
    state.invoiceDraft.extraLines.splice(idx,1); render(); return;
  }
  if(a==='open-service-picker'){
    if(!state.invoiceDraft) return;
    state.serviceSearch = '';
    openModal({type:'servicePicker'});
    return;
  }
  if(a==='pick-service'){
    var svc = getService(el.dataset.id);
    if(svc && state.invoiceDraft){
      state.invoiceDraft.extraLines.push({desc: svc.salesDescription || svc.name, qty:1, unitPrice: svc.salesUnitPrice||0, itemId: svc.id});
      toast('Added: '+svc.name);
    }
    openModal({type:'invoice', id:null, bookingId: state.invoiceDraft ? state.invoiceDraft.bookingId : null});
    return;
  }
  if(a==='cancel-service-pick'){
    openModal({type:'invoice', id:null, bookingId: state.invoiceDraft ? state.invoiceDraft.bookingId : null});
    return;
  }
  if(a==='open-product-picker'){
    if(!state.invoiceDraft) return;
    state.productSearch = '';
    openModal({type:'productPicker'});
    return;
  }
  if(a==='pick-product'){
    var prod = getProduct(el.dataset.id);
    if(prod && state.invoiceDraft){
      state.invoiceDraft.extraLines.push({desc: prod.salesDescription || prod.name, qty:1, unitPrice: prod.salesUnitPrice||0});
      toast('Added: '+prod.name);
    }
    openModal({type:'invoice', id:null, bookingId: state.invoiceDraft ? state.invoiceDraft.bookingId : null});
    return;
  }
  if(a==='cancel-product-pick'){
    openModal({type:'invoice', id:null, bookingId: state.invoiceDraft ? state.invoiceDraft.bookingId : null});
    return;
  }
  if(a==='save-invoice-draft' || a==='send-to-xero'){
    finalizeInvoice(el.dataset.booking, a==='send-to-xero'); return;
  }
  if(a==='remove-invoice-photo'){
    var phIdx = Number(el.dataset.idx);
    if(state.invoiceDraft) state.invoiceDraft.photos.splice(phIdx,1);
    var phBlock = document.getElementById('invoice-photos-block');
    if(phBlock) phBlock.innerHTML = invoicePhotosHTML(state.invoiceDraft.photos, true, 'draft');
    return;
  }
  if(a==='view-photo'){
    var photoSrc = null;
    if(el.dataset.scope==='draft'){
      var dp = state.invoiceDraft && state.invoiceDraft.photos[Number(el.dataset.idx)];
      photoSrc = dp ? dp.dataUrl : null;
    } else {
      var ivp = state.invoices.find(function(x){return x.id===el.dataset.inv;});
      var sp = ivp && ivp.photos && ivp.photos[Number(el.dataset.idx)];
      photoSrc = sp ? sp.dataUrl : null;
    }
    if(photoSrc) openPhotoLightbox(photoSrc);
    return;
  }
  if(a==='start-timer-pick'){ openModal({type:'timerPick'}); return; }
  if(a==='start-timer'){
    var bk = getBooking(el.dataset.id);
    state.timer = {bookingId: el.dataset.id, staffId: state.meId || (bk?bk.staffId:null), startedAt: Date.now()};
    safeSet('bb_timer', JSON.stringify(state.timer));
    if(state.modal && state.modal.type==='timerPick'){ closeModal(); }
    else { render(); }
    toast('Timer started'); return;
  }
  if(a==='stop-timer'){ openModal({type:'stopTimer'}); return; }
  if(a==='discard-timer'){ state.timer=null; safeSet('bb_timer',''); closeModal(); toast('Timer discarded'); return; }
  if(a==='log-time-manual'){ openModal({type:'logTime'}); return; }
}

async function finalizeInvoice(bookingId, send){
  // Make sure every photo's background upload (see addInvoicePhotos) has had
  // a chance to finish before this invoice is saved, so the saved record has
  // real assetUrls for the automatic Xero push to use — otherwise a photo
  // added moments before "Send to Xero" could get saved without one.
  if(state.invoiceDraft && state.invoiceDraft.photoUploads && state.invoiceDraft.photoUploads.length){
    try{ await Promise.all(state.invoiceDraft.photoUploads); }catch(e){}
  }
  var b = getBooking(bookingId);
  var unlinkedMins = unlinkedMinutesFor(bookingId);
  var laborAmt = (unlinkedMins/60)*b.rate;
  var extra = state.invoiceDraft ? state.invoiceDraft.extraLines : [];
  var lineItems = [{desc:'Labour — '+JOB_TYPE_LABEL[b.jobType]+' ('+fmtHrsMin(unlinkedMins)+' @ '+fmtMoney(b.rate)+'/hr)', amount:laborAmt}];
  extra.forEach(function(l){
    var linkedMins = l.itemId ? minutesForItem(bookingId, l.itemId) : 0;
    var desc = l.desc+' ('+l.qty+' × '+fmtMoney(l.unitPrice)+(linkedMins?' · '+fmtHrsMin(linkedMins)+' logged':'')+')';
    lineItems.push({desc:desc, amount:l.qty*l.unitPrice});
  });
  var subtotal = lineItems.reduce(function(a,l){return a+l.amount;},0);
  var gst = subtotal*0.1;
  var total = subtotal+gst;
  var photos = state.invoiceDraft ? state.invoiceDraft.photos : [];
  var invoice = {
    id: uid('inv'), bookingId: bookingId, customerName: b.customer.name, reference: b.reference||'',
    lineItems: lineItems, subtotal: subtotal, gst: gst, total: total,
    photos: photos, photosPending: false,
    status: 'draft', createdAt: Date.now(), sentAt: null,
    xeroInvoiceId: null, xeroInvoiceNumber: null, xeroInvoiceUrl: null
  };

  await saveDoc('invoices', invoice);
  state.invoiceDraft = null;
  closeModal();

  if(!send){
    toast('Draft saved');
    return;
  }

  // This app now has its own backend (see the "db wiring" note above), so
  // "Send to Xero" is a normal same-origin POST — the backend talks to the
  // Xero connector server-to-server and, on success, attaches any photos
  // too, all before this call returns. No more queueing or waiting.
  toast('Sending to Xero…');
  try{
    var res = await fetch('/api/invoices/'+invoice.id+'/send', {method:'POST', credentials:'same-origin'});
    var data = await res.json().catch(function(){ return null; });
    if(res.ok && data && data.ok){
      var updatedBooking = Object.assign({}, b, {status:'invoiced'});
      saveDoc('bookings', updatedBooking);
      localMutate('invoices', data.invoice);
      render();
      toast('Sent to Xero as draft invoice '+(data.invoice.xeroInvoiceNumber||''));
    } else {
      toast('Could not send to Xero — '+xeroErrorMessage(data && data.detail)+'. Saved as a local draft.');
    }
  }catch(e){
    toast('Could not reach the Xero connector. Saved as a local draft.');
  }
}

/* ===================== forms ===================== */
function handleFormSubmit(form){
  var type = form.dataset.form;
  var fd = new FormData(form);
  if(type==='account-settings'){
    var newSettings = {
      id:'company',
      companyName: (fd.get('companyName')||'').trim() || DEFAULT_SETTINGS.companyName,
      abn: (fd.get('abn')||'').trim(),
      phone: (fd.get('phone')||'').trim(),
      email: (fd.get('email')||'').trim(),
      address: (fd.get('address')||'').trim(),
      labourRate: Number(fd.get('labourRate'))||0,
      xeroWorkerUrl: (fd.get('xeroWorkerUrl')||'').trim()
    };
    saveSettings(newSettings);
    return;
  }
  if(type==='new-user'){
    var newUserBody = {
      name: (fd.get('name')||'').trim(),
      email: (fd.get('email')||'').trim(),
      password: fd.get('password')||'',
      role: fd.get('role')==='admin' ? 'admin' : 'staff'
    };
    fetch('/api/users', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(newUserBody)})
      .then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(res.ok){ toast('Login added for '+newUserBody.name); form.reset(); loadUsers(); }
        else if(res.data && res.data.error==='email_taken'){ toast('That email already has a login'); }
        else { toast('Could not add that login'); }
      })
      .catch(function(){ toast('Could not add that login'); });
    return;
  }
  if(type==='change-password'){
    var errEl = document.getElementById('change-password-error');
    if(errEl){ errEl.style.display='none'; }
    var pwBody = { currentPassword: fd.get('currentPassword')||'', newPassword: fd.get('newPassword')||'' };
    fetch('/api/me/password', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(pwBody)})
      .then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(res.ok){ toast('Password updated'); form.reset(); }
        else if(errEl){
          errEl.textContent = (res.data && res.data.error==='invalid_current_password') ? 'Current password is incorrect.' : 'Could not update password — check the new password is at least 8 characters.';
          errEl.style.display = 'block';
        }
      })
      .catch(function(){ if(errEl){ errEl.textContent='Could not reach the server — check your connection.'; errEl.style.display='block'; } });
    return;
  }
  if(type==='booking'){
    var id = form.dataset.id || uid('b');
    var existing = form.dataset.id ? getBooking(form.dataset.id) : null;
    var typedRef = (fd.get('reference')||'').trim();
    if(!typedRef){ toast('Reference # is required'); return; }
    var typedName = fd.get('custName');
    var typedPhone = fd.get('custPhone');
    var typedAddress = fd.get('address');
    var typedRego = fd.get('rego');
    var typedMakeModel = fd.get('makeModel');
    var saveVehicle = fd.get('saveVehicle')==='on';
    var matchedCust = findCustomerByName(typedName);
    var customerId = null;
    if(matchedCust){
      customerId = matchedCust.id;
      if(saveVehicle && typedRego){
        var updatedCust = Object.assign({}, matchedCust, {vehicles: upsertCustomerVehicle(matchedCust, typedRego, typedMakeModel)});
        saveDoc('customers', updatedCust);
      }
    } else if(fd.get('saveContact')==='on' && typedName){
      var newCust = {
        id: uid('c'), name: typedName, phone: typedPhone||'', email:'', address: typedAddress||'', notes:'',
        vehicles: (saveVehicle && typedRego) ? [{rego: typedRego, makeModel: typedMakeModel}] : [],
        createdAt: Date.now()
      };
      saveDoc('customers', newCust);
      customerId = newCust.id;
    }
    var obj = {
      id: id,
      date: fd.get('date'), start: fd.get('start'), end: fd.get('end'),
      staffId: fd.get('staffId'), jobType: fd.get('jobType'), reference: typedRef,
      customerId: customerId,
      customer: {name: typedName, phone: typedPhone},
      vehicle: {rego: typedRego, makeModel: typedMakeModel},
      address: typedAddress, rate: Number(fd.get('rate'))||0,
      notes: fd.get('notes'),
      serviceItems: state.bookingDraft ? state.bookingDraft.serviceItems : [],
      status: existing ? existing.status : 'booked',
      createdAt: existing ? existing.createdAt : Date.now()
    };
    saveDoc('bookings', obj);
    closeModal();
    toast(existing ? 'Booking updated' : 'Booking created');
    return;
  }
  if(type==='staff'){
    var sid = form.dataset.id || uid('s');
    var existingS = form.dataset.id ? getStaff(form.dataset.id) : null;
    var sobj = {
      id: sid, name: fd.get('name'), role: fd.get('role'), phone: fd.get('phone'),
      color: fd.get('color') || SWATCHES[0], active: fd.get('active')==='on'
    };
    saveDoc('staff', sobj);
    closeModal();
    toast(existingS ? 'Staff updated' : 'Staff added');
    return;
  }
  if(type==='service'){
    var svcId = form.dataset.id || uid('svc');
    var existingSvc = form.dataset.id ? getService(form.dataset.id) : null;
    var durH = Number(fd.get('durationH'))||0, durM = Number(fd.get('durationM'))||0;
    var svcObj = {
      id: svcId,
      code: fd.get('code'),
      name: fd.get('name'),
      salesDescription: fd.get('salesDescription'),
      salesUnitPrice: Number(fd.get('salesUnitPrice'))||0,
      purchasesDescription: existingSvc ? (existingSvc.purchasesDescription||'') : '',
      purchasesUnitPrice: fd.get('purchasesUnitPrice') ? Number(fd.get('purchasesUnitPrice')) : null,
      taxRate: fd.get('taxRate') || 'GST on Income',
      durationMins: (durH*60+durM) || 0,
      status: fd.get('active')==='on' ? 'Active' : 'Archived'
    };
    saveDoc('services', svcObj);
    closeModal();
    toast(existingSvc ? 'Service updated' : 'Service added');
    return;
  }
  if(type==='product'){
    var prodId = form.dataset.id || uid('prod');
    var existingProd = form.dataset.id ? getProduct(form.dataset.id) : null;
    var prodObj = {
      id: prodId,
      code: fd.get('code'),
      name: fd.get('name'),
      salesDescription: fd.get('salesDescription'),
      salesUnitPrice: Number(fd.get('salesUnitPrice'))||0,
      purchasesDescription: existingProd ? (existingProd.purchasesDescription||'') : '',
      purchasesUnitPrice: fd.get('purchasesUnitPrice') ? Number(fd.get('purchasesUnitPrice')) : null,
      taxRate: fd.get('taxRate') || 'GST on Income',
      quantity: fd.get('quantity') ? Number(fd.get('quantity')) : null,
      status: fd.get('active')==='on' ? 'Active' : 'Archived'
    };
    saveDoc('products', prodObj);
    closeModal();
    toast(existingProd ? 'Product updated' : 'Product added');
    return;
  }
  if(type==='customer'){
    var cid = form.dataset.id || uid('c');
    var existingC = form.dataset.id ? getCustomer(form.dataset.id) : null;
    var cobj = {
      id: cid, name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'),
      address: fd.get('address'), notes: fd.get('notes'),
      vehicles: state.customerDraft ? state.customerDraft.vehicles : [],
      createdAt: existingC ? existingC.createdAt : Date.now()
    };
    saveDoc('customers', cobj);
    closeModal();
    toast(existingC ? 'Customer updated' : 'Customer added');
    return;
  }
  if(type==='customer-vehicle'){
    var vRego = fd.get('rego'), vMakeModel = fd.get('makeModel');
    if(!vRego || !state.customerDraft) return;
    state.customerDraft.vehicles.push({rego: vRego, makeModel: vMakeModel});
    render();
    return;
  }
  if(type==='invoice-line'){
    var desc = fd.get('desc');
    var qty = Number(fd.get('qty'))||1;
    var unitPrice = Number(fd.get('unitPrice'))||0;
    if(!state.invoiceDraft) return;
    state.invoiceDraft.extraLines.push({desc:desc, qty:qty, unitPrice:unitPrice});
    render();
    return;
  }
  if(type==='manual-time'){
    var mbid = fd.get('bookingId');
    var mh = Number(fd.get('hours'))||0, mm = Number(fd.get('mins'))||0;
    var mtotal = mh*60+mm;
    if(!mbid || mtotal<=0){ toast('Pick a job and a duration'); return; }
    var mte = {id: uid('t'), bookingId: mbid, staffId: fd.get('staffId'), date: fd.get('date')||todayISO(), minutes: mtotal, note: fd.get('note'), itemId: fd.get('itemId')||null, createdAt: Date.now()};
    saveDoc('timeEntries', mte);
    closeModal();
    toast('Time logged');
    return;
  }
  if(type==='finish-timer'){
    var t = state.timer;
    if(!t) return;
    var finMin = Number(fd.get('minutes'))||1;
    var fte = {id: uid('t'), bookingId: t.bookingId, staffId: t.staffId, date: todayISO(), minutes: finMin, note: fd.get('note'), itemId: fd.get('itemId')||null, createdAt: Date.now()};
    saveDoc('timeEntries', fte);
    state.timer = null; safeSet('bb_timer','');
    closeModal();
    toast('Time logged from timer');
    return;
  }
}

/* ===================== change events ===================== */
function handleChange(el){
  if(el.dataset.change==='set-me'){
    state.meId = el.value || null;
    safeSet('bb_meId', state.meId || '');
    render();
  }
  if(el.dataset.change==='invoice-photo-input'){
    var files = Array.prototype.slice.call(el.files||[]);
    el.value = '';
    addInvoicePhotos(files);
  }
}

/* ===================== post-render wiring ===================== */
var timerInterval = null;
function wirePostRender(){
  if((state.view==='account' || state.view==='invoicing') && !state.xeroStatus && !state.xeroStatusLoading){
    refreshXeroStatus();
  }
  var searchInput = document.getElementById('jobs-search-input');
  if(searchInput){
    searchInput.addEventListener('input', function(){
      state.jobsSearch = searchInput.value;
      var list = document.getElementById('jobs-results-list');
      if(list) list.innerHTML = jobsResultsHTML();
    });
  }
  var svcViewSearchInput = document.getElementById('services-view-search-input');
  if(svcViewSearchInput){
    svcViewSearchInput.addEventListener('input', function(){
      state.servicesSearch = svcViewSearchInput.value;
      var list = document.getElementById('services-view-results-list');
      if(list) list.innerHTML = servicesViewResultsHTML();
    });
  }
  var prodViewSearchInput = document.getElementById('products-view-search-input');
  if(prodViewSearchInput){
    prodViewSearchInput.addEventListener('input', function(){
      state.productsSearch = prodViewSearchInput.value;
      var list = document.getElementById('products-view-results-list');
      if(list) list.innerHTML = productsViewResultsHTML();
    });
  }
  var custSearchInput = document.getElementById('customers-search-input');
  if(custSearchInput){
    custSearchInput.addEventListener('input', function(){
      state.customersSearch = custSearchInput.value;
      var list = document.getElementById('customers-results-list');
      if(list) list.innerHTML = customersResultsHTML();
    });
  }
  var svcSearchInput = document.getElementById('service-search-input');
  if(svcSearchInput){
    svcSearchInput.addEventListener('input', function(){
      state.serviceSearch = svcSearchInput.value;
      var list = document.getElementById('service-results-list');
      if(list) list.innerHTML = serviceResultsHTML();
    });
  }
  var prodSearchInput = document.getElementById('product-search-input');
  if(prodSearchInput){
    prodSearchInput.addEventListener('input', function(){
      state.productSearch = prodSearchInput.value;
      var list = document.getElementById('product-results-list');
      if(list) list.innerHTML = productResultsHTML();
    });
  }
  var logTimeBookingSelect = document.getElementById('log-time-booking-select');
  var logTimeItemSelect = document.getElementById('log-time-item-select');
  if(logTimeBookingSelect && logTimeItemSelect){
    logTimeBookingSelect.addEventListener('change', function(){
      logTimeItemSelect.innerHTML = itemOptionsHTML(getBooking(logTimeBookingSelect.value));
    });
  }
  var bookingSvcInput = document.getElementById('booking-service-input');
  if(bookingSvcInput){
    bookingSvcInput.addEventListener('input', function(){
      var match = findServiceByLabel(bookingSvcInput.value);
      if(match){
        if(!state.bookingDraft) state.bookingDraft = {key:'new', serviceItems:[]};
        var already = state.bookingDraft.serviceItems.some(function(it){ return it.id===match.id; });
        if(!already){
          state.bookingDraft.serviceItems.push({id:match.id, code:match.code, name:match.name, desc:match.salesDescription, price:match.salesUnitPrice, durationMins: match.durationMins||0});
          if(match.durationMins) bumpBookingEndTime(match.durationMins);
        }
        bookingSvcInput.value = '';
        var bsChips2 = document.getElementById('booking-service-chips');
        if(bsChips2) bsChips2.innerHTML = bookingServiceItemsHTML();
      }
    });
  }
  var custNameInput = document.getElementById('cust-name-input');
  if(custNameInput){
    custNameInput.addEventListener('input', function(){
      var match = findCustomerByName(custNameInput.value);
      var hint = document.getElementById('cust-match-hint');
      var saveRow = document.getElementById('save-contact-row');
      if(match){
        if(hint) hint.style.display = '';
        if(saveRow) saveRow.style.display = 'none';
        var phoneEl = document.querySelector('#booking-form [name=custPhone]');
        if(phoneEl && !phoneEl.value) phoneEl.value = match.phone || '';
        var addrEl = document.querySelector('#booking-form [name=address]');
        if(addrEl && !addrEl.value) addrEl.value = match.address || '';
      } else {
        if(hint) hint.style.display = 'none';
        if(saveRow) saveRow.style.display = '';
      }
    });
  }
  clearInterval(timerInterval);
  if(state.timer){
    timerInterval = setInterval(function(){
      var els = document.querySelectorAll('.timer-elapsed-el');
      for(var i=0;i<els.length;i++){ els[i].textContent = elapsedLabel(state.timer.startedAt); }
    }, 1000);
  }
}

/* ===================== global listeners (bound once) ===================== */
document.addEventListener('click', function(e){
  if(e.target && e.target.id==='confirm-backdrop'){ state.confirmDelete = null; render(); return; }
  if(e.target && e.target.id==='modal-backdrop'){ closeModal(); return; }
  var el = e.target.closest('[data-action]');
  if(el){ handleAction(el); return; }
});
document.addEventListener('submit', function(e){
  var form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  handleFormSubmit(form);
});
document.addEventListener('change', function(e){
  var el = e.target.closest('[data-change]');
  if(el) handleChange(el);
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  if(state.confirmDelete){ state.confirmDelete = null; render(); return; }
  if(state.modal){ closeModal(); }
});

/* ===================== boot ===================== */
bootApp();

})();
</script>
</body>
</html>
